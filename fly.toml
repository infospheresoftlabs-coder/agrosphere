# Fly.io deployment: https://fly.io/docs/reference/configuration/
#
#   fly launch --no-deploy --copy-config
#   fly postgres create --name agrosphere-db
#   fly postgres attach agrosphere-db          # sets DATABASE_URL
#   fly secrets set AGROSPHERE_SECRET_KEY="$(python3 -c 'import secrets;print(secrets.token_urlsafe(48))')"
#   fly deploy
#
# DATABASE_URL is provided by `fly postgres attach`; the app reads it as a
# fallback so no manual wiring is needed.
app = "agrosphere"
primary_region = "bom"   # Mumbai, closest to the target users

[build]
  dockerfile = "Dockerfile"

[env]
  AGROSPHERE_ENV = "production"
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
